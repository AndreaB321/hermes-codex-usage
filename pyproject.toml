[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-codex-usage"
version = "1.0.0"
description = "Hermes Agent CLI for OpenAI Codex rate limits and local multi-provider usage history"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Andrea"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/AndreaB321/hermes-codex-usage"
"Hermes Agent" = "https://github.com/NousResearch/hermes-agent"

[project.scripts]
hermes-codex-usage = "hermes_codex_usage:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["hermes_codex_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
